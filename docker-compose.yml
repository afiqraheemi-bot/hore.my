# Local development environment only.
# No production optimizations, no orchestration beyond Docker Compose.
# See docs/development/setup.md for usage.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # APP_ENV is deliberately NOT set here, for the identical reason
      # DB_DATABASE isn't (see below): it must come from .env ("local")
      # for a normal run, or from phpunit.xml ("testing") for a test
      # run. A real container-level env var here would silently win
      # over phpunit.xml's own <env> declaration, exactly as it
      # previously did for DB_CONNECTION/DB_DATABASE (P1-6).
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # DB_DATABASE is deliberately NOT set here — it must come from
      # .env (the application default, "hore_my") for a normal run, or
      # from phpunit.xml ("hore_my_test") for a test run, never a
      # single value shared by both. See infrastructure/postgres/
      # init-test-database.sql for the full P1-6 reasoning.
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: "null"
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3000"
      # The API's hostname is derived client-side from the page's own
      # window.location.hostname (see apps/web/app/composables/useApi.ts) —
      # only the port is configured, so the same build works whether the
      # browser reaches this container via localhost, 127.0.0.1, or a LAN
      # IP, with no machine-specific override needed.
      NUXT_PUBLIC_API_PORT: "8000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      # Use 127.0.0.1, not localhost: this container's /etc/hosts resolves
      # localhost to both 127.0.0.1 and ::1, and BusyBox wget tried the
      # IPv6 record first, which the dev server (bound via --host 0.0.0.0,
      # IPv4-only) refuses even while fully up. Discovered by runtime
      # validation (T0.5B).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16.15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hore_my
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/init-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hore_my"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      # Matches the image's own verified HEALTHCHECK instruction (Dockerfile
      # for axllent/mailpit v1.31.0): the `readyz` subcommand of the mailpit
      # binary itself, not an HTTP endpoint. Confirmed against upstream
      # source rather than assumed.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  api_vendor:
  web_node_modules:
