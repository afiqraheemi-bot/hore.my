# Local development environment only.
# No production optimizations, no orchestration beyond Docker Compose.
# See docs/development/setup.md for usage.

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: hore_my
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_ENCRYPTION: "null"
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NUXT_HOST: "0.0.0.0"
      NUXT_PORT: "3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    healthcheck:
      # Use 127.0.0.1, not localhost: this container's /etc/hosts resolves
      # localhost to both 127.0.0.1 and ::1, and BusyBox wget tried the
      # IPv6 record first, which the dev server (bound via --host 0.0.0.0,
      # IPv4-only) refuses even while fully up. Discovered by runtime
      # validation (T0.5B).
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16.15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hore_my
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hore_my"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      # Matches the image's own verified HEALTHCHECK instruction (Dockerfile
      # for axllent/mailpit v1.31.0): the `readyz` subcommand of the mailpit
      # binary itself, not an HTTP endpoint. Confirmed against upstream
      # source rather than assumed.
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  api_vendor:
  web_node_modules:
