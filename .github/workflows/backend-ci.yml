name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/backend-ci.yml
  push:
    branches: [main]
    paths:
      - apps/api/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  validate:
    name: Validate (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_DB: hore_my_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hore_my_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration tests deliberately address the named `pgsql`
      # connection even while phpunit.xml keeps SQLite as the fast default.
      # DB_URL therefore supplies the real PostgreSQL target without
      # weakening local unit-test isolation.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/hore_my_test
    strategy:
      fail-fast: false
      matrix:
        # composer.json's own require.php range is ">=8.4.1 <8.6" (P1-7,
        # 2026-09-08 audit remediation: corrected from ">=8.3 <8.6", which
        # falsely advertised PHP 8.3 support composer.lock's own resolved
        # symfony/* packages never actually allowed — discovered in T0.5B
        # Docker validation). PHP 8.3 is excluded here because it is no
        # longer a supported version per composer.json, not as a
        # workaround pending a future fix.
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, hash, iconv, json, libxml, mbstring, openssl, pcre, pdo, pdo_pgsql, pdo_sqlite, phar, session, tokenizer, xml, xmlwriter, zip
          coverage: none
          ini-values: variables_order=EGPCS
          tools: composer:2

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan / PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run tests against real PostgreSQL
        # PostgreSQL-specific guarantees (constraints, transactions,
        # locking, concurrency, migrations, tenant isolation, and financial
        # reporting) are release gates. A skipped test is therefore a CI
        # failure instead of a false-green build.
        run: php -d variables_order=EGPCS artisan test --fail-on-skipped
