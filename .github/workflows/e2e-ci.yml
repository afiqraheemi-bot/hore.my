name: E2E CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - docker-compose.yml
      - .github/workflows/e2e-ci.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - docker-compose.yml
      - .github/workflows/e2e-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Playwright, full Docker Compose stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Boots the identical stack a developer runs locally
      # (docker-compose.yml) rather than a parallel CI-only
      # bootstrapping procedure — the same containers, the same
      # healthchecks, the same NUXT_PUBLIC_API_PORT-derived,
      # window.location.hostname-based API resolution this suite exists
      # to prove works (see apps/web/app/composables/useApi.ts).
      - name: Start the full stack
        run: docker compose up -d --build --wait

      - name: Run database migrations
        run: docker compose exec -T api php artisan migrate --force

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        # Not SHA-pinned like this repo's other actions (checkout,
        # setup-node) — unlike those two, this repo has no prior use of
        # actions/upload-artifact to copy a verified commit SHA from,
        # and a fabricated SHA would silently break this step. Pin it
        # to a verified commit the next time this workflow is touched.
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
