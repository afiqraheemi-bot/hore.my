name: E2E CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - docker-compose.yml
      - .github/workflows/e2e-ci.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/api/**
      - docker-compose.yml
      - .github/workflows/e2e-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end (Playwright, full Docker Compose stack)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Installed natively, on the pristine checkout, before Docker ever
      # touches this tree: docker-compose.yml's `web` service bind-mounts
      # `./apps/web:/app` and layers a separate named volume at
      # `/app/node_modules` (so the container's own npm-managed deps
      # never leak onto the host). On native Linux Docker hosts (unlike
      # Docker Desktop's macOS VM, where this was never observed locally)
      # standing up that layered mount creates the `apps/web/node_modules`
      # mount-point directory on the host as root before the container
      # ever starts — so running `npm ci` after `docker compose up` here
      # failed with EACCES on the very first package it tried to write.
      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # Boots the identical stack a developer runs locally
      # (docker-compose.yml) rather than a parallel CI-only
      # bootstrapping procedure — the same containers, the same
      # healthchecks, the same NUXT_PUBLIC_API_PORT-derived,
      # window.location.hostname-based API resolution this suite exists
      # to prove works (see apps/web/app/composables/useApi.ts).
      - name: Start the full stack
        run: docker compose up -d --build --wait

      - name: Run database migrations
        run: docker compose exec -T api php artisan migrate --force

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, verified via `gh api repos/actions/upload-artifact/git/refs/tags/v4.6.2`
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
