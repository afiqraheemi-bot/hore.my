name: Frontend CI

on:
  pull_request:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/frontend-ci.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/frontend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  validate:
    # Named distinctly from Repository CI's own "Validate" job: both were
    # previously named "Validate", producing two indistinguishable
    # GitHub check-runs — impossible to reference unambiguously as a
    # required status check.
    name: Validate (Frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.8.1'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
